<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Delivera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="executive-surface-page governance-page portfolio-page">
  <a class="skip-to-content" href="#main-content">Skip to main content</a>

  <main class="portfolio-shell governance-shell" id="main-content" role="main" data-gov-brief-state="loading">
    <div id="portfolio-scope-bar-mount" class="gov-scope-bar-sticky portfolio-scope-bar" aria-label="Portfolio scope"></div>

    <div id="gov-loading" class="current-sprint-loading-with-spinner" aria-live="polite">
      <div class="current-sprint-loading-spinner" aria-hidden="true"></div>
      <p class="current-sprint-loading-msg gov-loading-msg">Preparing portfolio signal&hellip;</p>
    </div>

    <div class="portfolio-layout" id="portfolio-layout">
      <div class="portfolio-main-column">
        <div id="portfolio-signal-mount" class="portfolio-signal-mount" aria-label="AI portfolio signal"></div>
        <div id="portfolio-carousel-mount" class="portfolio-carousel-mount" aria-label="Compare squads"></div>
      </div>
      <aside class="portfolio-rail" aria-label="Portfolio decision">
        <div id="portfolio-why-mount" class="portfolio-why-mount"></div>
        <div id="portfolio-decision-mount" class="portfolio-decision-mount"></div>
      </aside>
    </div>

    <div id="portfolio-monitor-footer" class="portfolio-monitor-mount"></div>

    <!-- Legacy brief surfaces kept for data loaders / drawers (hidden from main path) -->
    <div id="gov-brief-content" class="gov-brief-layout" hidden>
      <div id="gov-scope-bar-mount" hidden></div>
      <div id="gov-verdict-mount" hidden></div>
      <div id="gov-intervention-case-mount" hidden></div>
      <div id="gov-answer-mount" hidden></div>
      <div id="gov-action-clusters-mount" hidden></div>
      <div id="gov-setup-debt-mount" hidden></div>
      <div id="gov-queue-mount" hidden></div>
      <div id="gov-freshness" hidden></div>
      <div id="gov-error" class="alert-banner" hidden role="alert"></div>
    </div>
  </main>

  <script type="module" src="Delivera-Shared-Health-Watchdog-01Client.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Governance-Brief-Page-Controller.js"></script>
</body>
</html>
