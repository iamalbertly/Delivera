<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief | Delivera</title>
  <link rel="stylesheet" href="styles.css?v=20260810b">
</head>
<body class="executive-surface-page governance-page">
  <div id="gov-scope-bar-mount" class="gov-scope-bar-sticky" aria-label="Brief scope"></div>
  <details id="gov-secondary-chrome" class="gov-secondary-chrome" hidden>
    <summary class="gov-secondary-chrome-summary">Feedback and survey</summary>
    <div id="gov-feedback-lab-mount"></div>
    <div id="gov-micro-survey-mount"></div>
  </details>

  <main class="governance-shell" id="main-content" role="main" data-gov-brief-state="loading">
    <div id="gov-loading" class="current-sprint-loading-with-spinner gov-value-shell" aria-live="polite" data-gov-loading-mode="cold">
      <div class="current-sprint-loading-spinner" aria-hidden="true"></div>
      <div><strong data-gov-loading-title>Building first verified answer…</strong><p class="current-sprint-loading-msg gov-loading-msg">Portfolio comparison and squad evidence are preparing. Decisions wait for verified Jira truth.</p></div>
    </div>
    <div id="gov-brief-content" class="gov-brief-layout">
      <div class="gov-main-column">
        <div id="gov-active-loop-mount" aria-live="polite"></div>
        <!-- Legacy Brief fallback mounts (hidden when Active Loop owns the page) -->
        <div id="gov-verdict-mount" class="gov-hero-verdict-mount" aria-label="Squad delivery pulse" hidden></div>
        <header class="governance-header gov-header-compact" hidden>
          <div id="gov-freshness" class="governance-freshness" aria-live="polite"></div>
          <div id="gov-answer-mount"></div>
        </header>
        <div id="gov-setup-debt-mount" hidden></div>

        <details id="gov-supporting-evidence" class="governance-evidence-wrap">
          <summary class="governance-section-title governance-evidence-summary">Proof audit &amp; data quality</summary>
          <div id="gov-measurement-mount" data-diagnostics-only hidden></div>
          <div id="gov-meeting-script-mount" data-diagnostics-only hidden></div>
          <section id="gov-proof-risks" class="governance-risks" aria-label="Proof detail"></section>
          <div id="gov-evidence" class="governance-evidence-table-wrap"></div>
          <div id="gov-technical-details" class="gov-technical-details"></div>
          <section id="gov-readiness" data-diagnostics-only hidden aria-label="Backlog readiness diagnostics"></section>
          <section id="gov-baseline" data-diagnostics-only hidden aria-label="Plan comparison diagnostics"></section>
          <section id="gov-scorecard" data-diagnostics-only hidden aria-label="Pilot diagnostics"></section>
        </details>
      </div>

      <aside id="gov-right-rail-mount" class="gov-right-rail" aria-label="Agent queue">
        <div id="gov-right-rail-proof-mount" class="gov-right-rail-proof" aria-live="polite"></div>
        <div id="gov-worker-receipt-mount" class="gov-right-rail-receipt"></div>
        <div id="gov-queue-mount" class="gov-inbox-mount gov-right-rail-queue" aria-label="Agent queue"></div>
        <div id="gov-pi-strip-mount" class="gov-right-rail-pi" hidden data-pi-strip-empty="true"></div>
      </aside>
    </div>
    <div id="gov-error" class="alert-banner" hidden role="alert"></div>
    <button type="button" id="gov-hidden-create-work" class="gov-visually-hidden" tabindex="-1" aria-hidden="true" data-open-outcome-modal data-outcome-projects="" data-outcome-context="Create work in Jira for selected squads.">Create work</button>
  </main>

  <script type="module" src="Delivera-Governance-FirstValue-01Bootstrap.js?v=20260810b"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Governance-Brief-Page-Controller.js?v=20260810b"></script>
</body>
</html>
