<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief | Delivera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="executive-surface-page governance-page">
  <div id="gov-scope-bar-mount" class="gov-scope-bar-sticky" aria-label="Brief scope"></div>
  <div id="gov-sticky-answer-mount" class="gov-sticky-answer-mount" aria-live="polite"></div>
  <div id="gov-worker-receipt-mount"></div>
  <div id="gov-queue-mount" class="gov-inbox-mount" aria-label="Agent queue"></div>

  <main class="governance-shell" id="main-content" role="main">
    <header class="governance-header">
      <div class="governance-header-top">
        <div>
          <p class="governance-eyebrow">Vodacom delivery accountability</p>
          <h1 class="governance-title">Today's delivery answer</h1>
        </div>
        <div class="governance-actions" role="group" aria-label="Brief actions">
          <button type="button" id="gov-export" class="btn btn-secondary btn-compact">Export brief</button>
        </div>
      </div>
      <div id="gov-freshness" class="governance-freshness" aria-live="polite"></div>
      <div id="gov-pi-strip-mount"></div>
      <div id="gov-answer-mount"></div>
      <div id="gov-feedback-lab-mount"></div>
    </header>

    <div id="gov-setup-debt-mount"></div>
    <div id="gov-verdict-mount"></div>
    <div id="gov-action-clusters-mount"></div>
    <div id="gov-meeting-script-mount"></div>
    <div id="gov-micro-survey-mount"></div>
    <div id="gov-measurement-mount"></div>
    <div id="gov-epic-hygiene-mount"></div>

    <details id="gov-supporting-evidence" class="governance-evidence-wrap">
      <summary class="governance-section-title governance-evidence-summary">Supporting evidence</summary>
      <section id="gov-proof-risks" class="governance-risks" aria-label="Proof detail"></section>
      <div id="gov-evidence" class="governance-evidence-table-wrap"></div>
      <div id="gov-technical-details" class="gov-technical-details"></div>
      <h3 class="governance-subsection-title">Backlog readiness</h3>
      <section id="gov-readiness" class="governance-readiness" aria-label="Backlog readiness"></section>
      <h3 class="governance-subsection-title">Plan vs now</h3>
      <section id="gov-baseline" class="governance-baseline" aria-label="Plan vs now"></section>
      <h3 class="governance-subsection-title">Pilot metrics</h3>
      <section id="gov-scorecard" class="governance-scorecard" aria-label="Pilot scorecard"></section>
    </details>

    <div id="gov-error" class="alert-banner" hidden role="alert"></div>
  </main>

  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Governance-Brief-Page-Controller.js"></script>
</body>
</html>
