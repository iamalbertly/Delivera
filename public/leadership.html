<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance - Leadership trends | Delivera</title>
  <style>
    body{background:#f5f6f8;margin:0}
    [data-instant-shell-mount][aria-busy="true"]:empty{min-height:52vh;background:#f5f6f8;display:grid}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="hud-mode" data-delivera-surface="leadership" data-delivera-data-state="loading">
  <div class="hud-shell">
    <header class="hud-header-mission-control">
      <div class="hud-header-top">
        <div>
          <h1 class="hud-title">Leadership</h1>
          <p class="hud-subtitle">Portfolio delivery, business impact, and trust signals.</p>
        </div>
        <div class="hud-status-row">
          <span id="connection-status" class="hud-status-pill is-live">Live</span>
          <span id="last-updated" class="hud-freshness-pill">Updating...</span>
        </div>
      </div>
      <div id="leadership-header-actions" class="hud-actions-row" role="group" aria-label="Leadership quick actions">
        <button type="button" class="btn btn-primary btn-compact" data-open-outcome-modal data-outcome-context="Create work from leadership risk and trend signals." data-shared-action-tier="primary">Create work</button>
        <button type="button" id="leadership-refresh-btn" class="btn btn-secondary btn-compact" data-shared-action-tier="secondary">Refresh</button>
        <a href="/current-sprint" class="btn btn-secondary btn-compact" data-shared-action-tier="secondary">Sprint</a>
        <a href="/report" class="btn btn-secondary btn-compact" data-shared-action-tier="secondary">Report</a>
      </div>
      <div id="project-context" data-context-bar="true"></div>
      <p id="leadership-confidence-strip" class="hud-summary-line">State: Updated - loading confidence and data trust...</p>
      <p id="leadership-summary" class="hud-summary-line">Loading the portfolio story for leaders...</p>
    </header>

    <main class="hud-grid" id="hud-grid" role="main" data-instant-shell-mount="leadership" aria-busy="true"></main>
  </div>

  <script type="module" src="Delivera-Shared-Runtime-Notification-Bridge.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Leadership-HUD-Controller.js"></script>
</body>
</html>
