<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actions | Delivera</title>
  <link rel="stylesheet" href="styles.css?v=20260723a">
</head>
<body class="executive-surface-page actions-page" data-surface-name="Actions">
  <div class="container"><main id="main-content" class="executive-surface-shell">
    <section class="surface-card actions-queue-card" aria-labelledby="actions-queue-title">
      <div class="actions-queue-head">
        <div>
          <p class="surface-eyebrow">Shared intervention queue</p>
          <h1 id="actions-queue-title">Open governance actions</h1>
          <p id="actions-queue-summary" aria-live="polite">Loading the last verified queue…</p>
          <div id="actions-identity-links" class="gov-loop-identity-links" hidden aria-live="polite"></div>
        </div>
        <details class="actions-queue-filters">
          <summary>Filters</summary>
          <div class="actions-queue-filters-body">
            <label>State<select id="actions-state-filter"><option value="">All open states</option><option value="reply-received-ready-to-recheck">Ready to re-check</option><option value="escalation-due">Escalation due</option><option value="awaiting-owner">Awaiting owner</option><option value="needs-attention">Needs attention</option></select></label>
            <label>Owner route<select id="actions-owner-filter"><option value="">All owner routes</option><option value="unresolved">Owner unresolved</option><option value="resolved">Owner resolved</option></select></label>
          </div>
        </details>
      </div>
      <div id="actions-queue-mount" class="actions-queue" aria-live="polite"></div>
    </section>
  </main></div>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Actions-CaseQueue-01UI.js?v=20260729f"></script>
</body>
</html>
