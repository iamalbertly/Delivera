<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actions | Delivera</title>
  <style>
    body{background:#f5f6f8;margin:0}
    [data-instant-shell-mount][aria-busy="true"]:empty{min-height:52vh;background:#f5f6f8;display:block}
    .instant-shimmer{height:.85rem;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f8f8fa,#eef2f7);background-size:200% 100%;animation:dlvr-shim 1.2s ease-in-out infinite}
    @keyframes dlvr-shim{0%,100%{opacity:.7}50%{opacity:1}}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="actions-page executive-surface-page" data-delivera-surface="actions" data-delivera-data-state="loading">
  <a class="skip-to-content" href="#main-content">Skip to main content</a>
  <main id="main-content" class="actions-shell" role="main" data-delivera-surface="actions" data-delivera-data-state="loading">
    <header class="actions-header">
      <h1>Actions</h1>
      <p class="actions-subtitle">Nudges, decisions, escalations, and proof — grouped by case.</p>
    </header>
    <div id="actions-batch-bar" class="actions-batch-bar" hidden></div>
    <nav class="actions-tabs" aria-label="Actions tabs" id="actions-tabs"></nav>
    <div class="actions-layout">
      <section id="actions-list" class="actions-list" data-instant-shell-mount="actions" aria-live="polite" aria-busy="true"></section>
      <aside id="actions-preview-rail" class="actions-preview-rail" aria-label="Case preview" hidden></aside>
    </div>
  </main>
  <script type="module" src="Delivera-Shared-Runtime-Notification-Bridge.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Actions-Page-Init.js"></script>
</body>
</html>
