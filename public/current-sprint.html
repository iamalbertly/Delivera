<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today - Delivera</title>
  <style>
        html,body{background:var(--surface-page,#f5f6f8);margin:0}
    [data-instant-shell-mount][aria-busy="true"]{min-height:52vh;background:#f5f6f8;display:block}
    [data-instant-shell-mount]:empty,[data-instant-shell-mount].instant-shell-mount--reserve{min-height:40vh;background:#f5f6f8}
    .instant-shimmer{height:.85rem;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f8f8fa,#eef2f7);background-size:200% 100%;animation:dlvr-shim 1.2s ease-in-out infinite;margin:.35rem 0}
    @keyframes dlvr-shim{0%,100%{opacity:.7}50%{opacity:1}}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="executive-surface-page current-sprint-page" data-delivera-surface="current-sprint" data-delivera-data-state="loading">
  <div class="container">
    <header>
      <div class="current-sprint-header">
        <h1 class="current-sprint-page-title-wrap"><span id="current-sprint-title">Today</span> <span id="current-sprint-name" class="sprint-name"></span></h1>
        <div class="board-select-wrap">
          <div class="current-sprint-scope-stack">
            <p id="current-sprint-scope-chip" class="current-sprint-scope-inherit-chip" hidden>
              <span id="current-sprint-scope-chip-label"></span>
              <a href="/governance" class="current-sprint-scope-change-link">Change on Answer</a>
            </p>
            <div class="current-sprint-control-field" id="current-sprint-board-controls">
              <div class="current-sprint-scope-row current-sprint-scope-row--compact">
                <div class="current-sprint-scope-inline">
                <select id="current-sprint-projects" aria-label="Select project">
                  <option value="">Loading squads...</option>
                </select>
                <select id="board-select" aria-label="Select board">
                  <option value="">Loading boards...</option>
                </select>
                </div>
                <span id="current-sprint-single-project-hint" class="current-sprint-scope-badge" aria-live="polite" hidden></span>
                <div class="current-sprint-jump-inline">
                  <input id="issue-jump-input" type="text" class="input-compact" placeholder="Filter sprint work: KEY, URL, summary" aria-label="Filter sprint work by key, URL, or summary">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content" data-current-sprint-state="loading" data-delivera-surface="current-sprint" data-delivera-data-state="loading">
      <div id="current-sprint-ribbon" class="preview-status-strip" style="display: none;" aria-live="polite"></div>
      <div id="current-sprint-loading" data-instant-shell-mount="current-sprint" aria-busy="true">
        <div class="instant-shell" data-testid="instant-shell" data-instant-shell-cold="1" aria-busy="true" role="status" style="padding:1rem">
          <div class="instant-shell-state-strip" data-testid="instant-shell-state-strip">
            <span class="instant-shell-state-surface">Today</span>
            <span class="instant-shell-state-scope">Restoring your squad and active sprint</span>
            <span class="instant-shell-state-sub">Checking progress, blockers, scope change, and owners</span>
          </div>
          <p class="instant-shell-value-line">The current health verdict and strongest intervention will appear first.</p>
          <div class="instant-shell-header-bar"><div class="instant-shimmer" style="width:24%"></div><div class="instant-shimmer" style="width:48%"></div></div>
          <div class="instant-shell-sprint-grid">
            <div class="instant-shell-signal-row">
              <div class="instant-shell-signal-card"><div class="instant-shimmer" style="width:40%"></div><div class="instant-shimmer" style="width:72%"></div></div>
              <div class="instant-shell-signal-card"><div class="instant-shimmer" style="width:42%"></div><div class="instant-shimmer" style="width:68%"></div></div>
              <div class="instant-shell-signal-card"><div class="instant-shimmer" style="width:38%"></div><div class="instant-shimmer" style="width:75%"></div></div>
            </div>
            <div class="instant-shell-blockers"><div class="instant-shimmer" style="width:34%"></div><div class="instant-shimmer" style="width:88%"></div><div class="instant-shimmer" style="width:64%"></div></div>
            <div class="instant-shell-stories">
              <div class="instant-shell-story-row"><div class="instant-shimmer" style="width:15%"></div><div class="instant-shimmer" style="width:62%"></div><div class="instant-shimmer" style="width:12%"></div></div>
              <div class="instant-shell-story-row"><div class="instant-shimmer" style="width:15%"></div><div class="instant-shimmer" style="width:55%"></div><div class="instant-shimmer" style="width:12%"></div></div>
            </div>
          </div>
          <p class="instant-shell-label">Showing the sprint structure immediately while Jira evidence refreshes…</p>
        </div>
      </div>
      <div id="current-sprint-error" class="alert alert-error" style="display: none;"></div>
      <div id="current-sprint-content"></div>
    </main>
  </div>
  <script type="module" src="Delivera-Shared-Runtime-Notification-Bridge.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-CurrentSprint-Page-Init-Controller.js"></script>
</body>
</html>
