<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Delivera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="executive-surface-page settings-page" data-surface-name="Settings">
  <div class="container">
    <main id="main-content" class="executive-surface-shell settings-hub-layout">
      <section class="surface-hero-card">
        <p class="surface-eyebrow">Settings</p>
        <h1>Control trust, not just preferences</h1>
        <p class="surface-lead">Keep configuration close to the business questions it affects: project context, data hygiene, and the quality of decisions made from the dashboard.</p>
        <div id="surface-context-bar"></div>
        <p id="surface-summary-line" class="surface-summary-line"></p>
      </section>
      <nav id="settings-nav-rail" class="settings-nav-rail surface-card" aria-label="Settings sections"></nav>
      <div class="settings-hub-panels">
        <div id="settings-my-workspace"></div>
        <div id="settings-organization"></div>
        <div id="settings-integrations"></div>
        <section id="jira-activity" class="surface-card jira-activity-section settings-section-card">
          <h2>Jira activity</h2>
          <p>Comments sent from Current Sprint. Review what was posted and undo when Jira allows.</p>
          <div id="jira-activity-panel" class="jira-activity-panel"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="Delivera-Shared-Runtime-Notification-Bridge.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Shared-UI-Header-Nav-Renderer.js"></script>
  <script type="module" src="Delivera-Executive-Surface-Init.js"></script>
  <script type="module" src="Delivera-Settings-Page-01Controller.js"></script>
</body>
</html>
