<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Delivera</title>
  <style>
    body{background:#f5f6f8;margin:0}
    [data-instant-shell-mount][aria-busy="true"]:empty{min-height:40vh;background:#f5f6f8;display:block}
    .instant-shimmer{height:.85rem;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f8f8fa,#eef2f7);background-size:200% 100%;animation:dlvr-shim 1.2s ease-in-out infinite}
    @keyframes dlvr-shim{0%,100%{opacity:.7}50%{opacity:1}}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="executive-surface-page settings-page" data-surface-name="Settings" data-delivera-surface="settings" data-delivera-data-state="loading">
  <div class="container">
    <main id="main-content" class="executive-surface-shell settings-hub-layout" data-delivera-surface="settings" data-delivera-data-state="loading">
      <section class="surface-hero-card settings-hero-compact">
        <p class="surface-eyebrow">Settings</p>
        <h1>Your workspace &amp; trust</h1>
        <p class="surface-lead settings-hero-lead">Defaults, org catalog, integrations, and activity — linked to Portfolio, Squads, and Actions.</p>
        <div id="surface-context-bar"></div>
        <p id="surface-summary-line" class="surface-summary-line"></p>
      </section>
      <nav id="settings-nav-rail" class="settings-nav-rail surface-card" aria-label="Settings sections"></nav>
      <div class="settings-hub-panels" aria-busy="true">
        <div id="settings-instant-shell-mount" data-instant-shell-mount="settings" aria-busy="true"></div>
        <div id="settings-my-workspace"></div>
        <div id="settings-organization"></div>
        <div id="settings-epic-format"></div>
        <div id="settings-integrations"></div>
        <section id="jira-activity" class="surface-card jira-activity-section settings-section-card" hidden>
          <h2>Jira activity</h2>
          <p>Comments sent from Current Sprint. Review what was posted and undo when Jira allows.</p>
          <div id="jira-activity-panel" class="jira-activity-panel"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="Delivera-Shared-Runtime-Notification-Bridge.js"></script>
  <script type="module" src="Delivera-Shared-Health-Watchdog-01Client.js"></script>
  <script type="module" src="Delivera-Shared-Global-Nav.js"></script>
  <script type="module" src="Delivera-Executive-Surface-Init.js"></script>
  <script type="module" src="Delivera-Settings-Page-01Controller.js"></script>
</body>
</html>
