<body class="executive-surface-page settings-page" data-surface-name="Settings">

    <main id="main-content" class="executive-surface-shell">
      <section class="surface-hero-card settings-hero--compact settings-health-hero">
        <p class="surface-eyebrow">Settings</p>
        <h1>Organization health</h1>
        <p class="surface-lead">Squad ownership, processing capacity, privacy, and shared cache health—one operational truth.</p>
        <div id="surface-context-bar"></div>
        <p id="surface-summary-line" class="surface-summary-line" hidden></p>
      </section>
      <section id="gov-settings-registry-mount" class="surface-card governance-registry-card" aria-labelledby="governance-registry-title"></section>

      <section id="jira-activity" class="surface-card jira-activity-section">
        <h2>Jira activity</h2>
        <p>Comments sent from Current Sprint. Review what was posted and undo when Jira allows.</p>
        <div id="jira-activity-panel" class="jira-activity-panel"></div>
      </section>
    </main>
  </div>
