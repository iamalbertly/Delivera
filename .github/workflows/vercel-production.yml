name: Vercel Production

on:
  push:
    branches: [autohacker-20260615_093142]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate source and generated CSS
        run: |
          npm run build:css
          npm run check:css
          node -e "import('./lib/currentSprint.js').then(()=>import('./lib/snapshot-worker.js'))"
      - name: Require Vercel deployment credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Build production artifact
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production artifact
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verify production routes
        env:
          PRODUCTION_URL: https://vodaagileboard.vercel.app
        run: |
          curl --fail --retry 6 --retry-delay 10 "$PRODUCTION_URL/api/healthz"
          curl --fail --retry 6 --retry-delay 10 "$PRODUCTION_URL/version"
          curl --fail --retry 6 --retry-delay 10 "$PRODUCTION_URL/governance" > /dev/null
