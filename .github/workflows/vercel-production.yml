name: Vercel Production

on:
  push:
    branches: [autohacker-20260615_093142]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate source and generated CSS
        run: |
          npm run build:css
          npm run check:css
          node -e "import('./lib/currentSprint.js').then(()=>import('./lib/snapshot-worker.js'))"
      - name: Detect Vercel deployment credentials
        id: vercel-credentials
        run: |
          if test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel Git integration will provide the deployment; validating commit provenance below."
          fi
      - name: Build production artifact
        if: steps.vercel-credentials.outputs.available == 'true'
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production artifact
        if: steps.vercel-credentials.outputs.available == 'true'
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verify production routes
        env:
          PRODUCTION_URL: https://vodaagileboard.vercel.app
        run: |
          curl --fail --retry 6 --retry-delay 10 "$PRODUCTION_URL/healthz"
          for attempt in $(seq 1 18); do
            curl --fail --silent "$PRODUCTION_URL/version" > version-response.json
            if node -e "const v=require('./version-response.json'); process.exit(v.commit===process.env.GITHUB_SHA.slice(0,7) ? 0 : 1)"; then
              break
            fi
            if test "$attempt" = "18"; then
              echo "Production did not reach commit ${GITHUB_SHA:0:7} within three minutes."
              exit 1
            fi
            sleep 10
          done
          node -e "const v=require('./version-response.json'); const expected=process.env.GITHUB_SHA.slice(0,7); if(v.commit!==expected) throw new Error('Production commit '+v.commit+' does not match '+expected); if(v.version!=='0.0.0.2') throw new Error('Unexpected production version '+v.version)"
          curl --fail --retry 6 --retry-delay 10 "$PRODUCTION_URL/governance" > /dev/null
          curl --fail --retry 3 --retry-delay 5 "$PRODUCTION_URL/api/governance-brief.json?projects=SD" > governance-brief-response.json
          node -e "const b=require('./governance-brief-response.json'); if(b.error) throw new Error('Governance evidence failed: '+b.error); if(!b.generatedAt || !Array.isArray(b.projects) || !b.projects.length || !b.freshness) throw new Error('Governance evidence contract is incomplete'); if(b.meta?.evidenceUnavailable) throw new Error('Governance deployed in cannot-verify state: '+(b.meta.evidenceFailureCode||'unknown Jira failure'));"
