name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run brand:guard
      - run: npm run identity:check
      - run: npx playwright install --with-deps chromium
      # Guard: fail fast if styles.css was edited directly instead of via partials
      - name: Verify CSS partials are in sync
        run: npm run build:css && npm run check:css
      - name: Run five risk-ranked release scenarios
        run: npm run test:governance:release
        env:
          CI: true
          NODE_ENV: test
          JIRA_HOST: https://example.atlassian.net
          JIRA_EMAIL: ci-placeholder@example.com
          JIRA_API_TOKEN: ci-placeholder-token
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify Render deployment credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DELIVERA_PROD_BASE_URL: ${{ secrets.DELIVERA_PROD_BASE_URL != '' && secrets.DELIVERA_PROD_BASE_URL || secrets.VODAAGILEBOARD_PROD_BASE_URL }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing RENDER_SERVICE_ID"; exit 1; }
          test -n "$DELIVERA_PROD_BASE_URL" || { echo "Missing DELIVERA_PROD_BASE_URL"; exit 1; }
      - run: npx playwright install --with-deps chromium
      # Blueprint validation requires Render CLI v2.7.0 or later. Keep a known release pinned.
      - name: Install Render CLI
        run: |
          curl -L https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip -o render.zip
          unzip -q -o render.zip cli_v2.22.0
          sudo mv cli_v2.22.0 /usr/local/bin/render
          render --version
      - name: Validate render.yaml blueprint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render blueprints validate --workspace "${{ secrets.RENDER_WORKSPACE_ID }}"
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render deploys create ${{ secrets.RENDER_SERVICE_ID }} --output json --confirm --wait
      - name: Run deploy smoke tests against live app
        env:
          CI: true
          BASE_URL: ${{ secrets.DELIVERA_PROD_BASE_URL != '' && secrets.DELIVERA_PROD_BASE_URL || secrets.VODAAGILEBOARD_PROD_BASE_URL }}
          SKIP_WEBSERVER: true
          TEST_LOGIN_USER: ${{ secrets.APP_LOGIN_USER }}
          TEST_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
        run: npx playwright test tests/Delivera-Deploy-Smoke-Validation-Tests.spec.js --max-failures=1 --workers=1 --reporter=list
